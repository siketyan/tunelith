[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
tunelith = { path = "crates/tunelith" }
tunelith-core = { path = "crates/tunelith-core", default-features = false }
tunelith-driver-pt4k = { path = "crates/tunelith-driver-pt4k" }
tunelith-driver-px4 = { path = "crates/tunelith-driver-px4" }
