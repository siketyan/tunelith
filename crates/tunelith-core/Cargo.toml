[package]
name = "tunelith-core"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license = "MIT OR Apache-2.0"
description = "Core types and traits of Tunelith, a tuner abstraction for Japanese digital broadcasting"

[features]
default = ["dvb"]
dvb = ["dep:blocking", "dep:libc"]
bda = ["dep:blocking", "dep:windows-sys"]
usb = ["dep:blocking", "dep:futures-timer", "dep:nusb"]

[dependencies]
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
blocking = { version = "1", optional = true }
protobuf = "3.7.2"
thiserror = "2"
futures-timer = { version = "3", optional = true }
nusb = { version = "0.2.7", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { version = "3", optional = true, features = ["wasm-bindgen"] }

[dev-dependencies]
futures = { version = "0.3", features = ["executor"] }

[build-dependencies]
protobuf-codegen = "3.7.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Media_KernelStreaming",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
