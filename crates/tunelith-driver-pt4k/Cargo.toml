[package]
name = "tunelith-driver-pt4k"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license = "MIT OR Apache-2.0"
description = "Tunelith driver for PT4K (TBS6812)"

[target.'cfg(target_os = "linux")'.dependencies]
tunelith-core = { workspace = true, features = ["dvb"] }

[target.'cfg(windows)'.dependencies]
tunelith-core = { workspace = true, features = ["bda"] }
