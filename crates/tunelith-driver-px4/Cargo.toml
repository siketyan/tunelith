[package]
name = "tunelith-driver-px4"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license = "GPL-2.0-only"
description = "Tunelith driver for the PLEX PX4/PX-MLT series and their kin, run in user space over USB"

[dependencies]
futures = "0.3"
futures-timer = "3"
tunelith-core = { workspace = true, features = ["usb"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { version = "3", features = ["wasm-bindgen"] }
wasm-bindgen-futures = "0.4"
