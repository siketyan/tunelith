[package]
name = "tunelith"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license = "MIT OR Apache-2.0"
description = "Client of tunelithd, sharing Japanese digital broadcasting tuners"

[dependencies]
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tunelith-core.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal"] }
