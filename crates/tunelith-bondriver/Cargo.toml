[package]
name = "tunelith-bondriver"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license = "MIT OR Apache-2.0"
description = "BonDriver_Tunelith, a BonDriver receiving through tunelithd"
publish = false

[lib]
name = "BonDriver_Tunelith"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
tunelith.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
